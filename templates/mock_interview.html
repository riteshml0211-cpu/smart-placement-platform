<!DOCTYPE html>
<html>
<head>

    <title>AI Mock Interview</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <h2>🎤 AI Mock Interview</h2>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="dashboard">

    <div class="dashboard-card">

        <h1>Start Mock Interview</h1>

        <form method="POST">

            <input
            type="text"
            name="role"
            placeholder="Example: Python Developer"
            required>

            <br><br>

            <button type="submit">

                Start Interview

            </button>

        </form>

    </div>

    {% if result %}

    <br>

    <div class="dashboard-card">

        <h2>AI Interview Questions</h2>

        <br>

        <p style="white-space:pre-line; line-height:1.8;">

            {{ result }}

        </p>

    </div>

    {% endif %}

</div>

</body>
</html>
