<!DOCTYPE html>
<html>
<head>

    <title>Resume Analyzer</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <h2>🤖 AI Resume Analyzer</h2>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="dashboard">

    <div class="dashboard-card">

        <h1>Paste Resume Text</h1>

        <form method="POST">

            <textarea
            name="resume_text"
            rows="12"
            style="
            width:100%;
            padding:15px;
            border-radius:15px;
            background:rgba(255,255,255,0.1);
            color:white;
            border:none;
            "
            placeholder="Paste resume here..."
            ></textarea>

            <br><br>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

    {% if result %}

    <div class="dashboard-card">

        <h2>AI Analysis Result</h2>

        <br>

        <p>{{ result }}</p>

    </div>

    {% endif %}

</div>

</body>
</html>
