<!DOCTYPE html>
<html>
<head>

    <title>AI Assistant</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <h2>🤖 AI Assistant</h2>

    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="dashboard">

    <div class="dashboard-card">

        <h1>Ask AI Mentor</h1>

        <form method="POST">

            <textarea
            name="question"
            rows="6"
            style="
            width:100%;
            padding:15px;
            border:none;
            border-radius:15px;
            background:rgba(255,255,255,0.1);
            color:white;
            "
            placeholder="Ask anything..."
            ></textarea>

            <br><br>

            <button type="submit">

                Ask AI

            </button>

        </form>

    </div>

    {% if result %}

    <br>

    <div class="dashboard-card">

        <h2>AI Response</h2>

        <br>

        <p style="white-space:pre-line; line-height:1.8;">

            {{ result }}

        </p>

    </div>

    {% endif %}

</div>

</body>
</html>
